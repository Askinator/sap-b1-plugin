name: consistency

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run consistency checks
        # Deliberately no claude CLI here: manifest validation stays a local
        # pre-release step (run scripts/check.sh before bumping the version).
        # CI covers the skill-index coverage checks, which need no CLI.
        run: ./scripts/check.sh
